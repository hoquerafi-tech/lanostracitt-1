{% extends 'base.html' %}
{% block content %}
<h1>Nuova segnalazione</h1>
<form method="post" enctype="multipart/form-data" class="card">
  <label>Titolo <input name="titolo" required maxlength="150"></label>
  <label>Descrizione <textarea name="descrizione" rows="5" required></textarea></label>
  <fieldset><legend>Categorie</legend>
    {% for c in categorie %}
      <label class="inline"><input type="checkbox" name="categorie" value="{{ c.id }}"> {{ c.nome_categoria }}</label>
    {% endfor %}
  </fieldset>
  <label>Foto o video (obbligatorio) <input type="file" name="media" accept="image/*,video/*" required></label>
  <p>Clicca sulla mappa per indicare il luogo:</p>
  <div id="mappa"></div>
  <input type="hidden" name="latitudine" id="lat">
  <input type="hidden" name="longitudine" id="lng">
  <button>Invia</button>
</form>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'mappa',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [9.19, 45.4642],
  zoom: 12
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.AttributionControl({
  compact: true,
  customAttribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
}));
let marker;
map.on('click', event => {
  if (marker) marker.remove();
  marker = new maplibregl.Marker().setLngLat(event.lngLat).addTo(map);
  document.getElementById('lat').value = event.lngLat.lat.toFixed(6);
  document.getElementById('lng').value = event.lngLat.lng.toFixed(6);
});
</script>
{% endblock %}
